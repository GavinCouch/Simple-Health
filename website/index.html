<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153c35"><link rel="icon" href="data:,"><meta name="description" content="Track your daily calories, log meals, and follow your personal calorie goal."><title>Calorie tracker</title><link rel="stylesheet" href="style.css"></head>
<body>
<main><div class="page-heading"><div class="date-control"><button id="previous" aria-label="Previous day">‹</button><input id="day" type="date" aria-label="Journal date"><button id="next" aria-label="Next day">›</button></div><button id="goalButton" class="outline">Edit daily goal</button></div>
<div class="layout"><div class="journal"><section class="summary"><div><span class="eyebrow">CALORIES CONSUMED</span><div class="total"><span id="total">0</span><small>kcal</small></div><p id="remaining">Set a goal to see your daily progress.</p><div class="progress"><div id="progress"></div></div><div class="progress-label"><span id="percent"></span><span id="goalLabel">No goal set</span></div></div></section>
<div class="section-heading"><h2>Food journal</h2><span id="entryCount">0 entries</span></div><div id="meals"></div></div>
<aside><section class="entry-panel"><h2 id="formTitle">Log your food</h2><form id="entryForm"><label>Food name<input id="food" maxlength="100" placeholder="e.g. Oatmeal with berries" required></label><div class="form-grid"><label>Calories per serving<input id="calories" type="number" min="0" max="10000" step="1" placeholder="250" required></label><label>Servings<input id="servings" type="number" min="0.1" max="100" step="0.1" value="1" required></label></div><label>Meal<select id="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select></label><div class="entry-total"><span>Entry total</span><strong><span id="estimate">0</span> kcal</strong></div><button class="primary" type="submit" id="submitEntry">+ Add to journal</button><button class="cancel" type="button" id="cancelEdit" hidden>Cancel editing</button></form></section></aside></div><div id="notice" role="status" aria-live="polite"></div></main>
<dialog id="goalDialog"><form id="goalForm"><button class="close" type="button" id="closeGoal" aria-label="Close">×</button><h2>Set your calorie goal</h2><label>Daily calories<input id="goalInput" type="number" min="1" max="20000" step="1" required placeholder="Enter your goal"></label><button class="primary">Save goal</button></form></dialog><script src="app.js"></script></body></html>
