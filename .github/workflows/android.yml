name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test, and build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: simple_health
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Check website JavaScript
        run: node --check ../website/app.js
      - name: Build pull request APK
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/simple-health.jks"
      - name: Build signed APK and app bundle
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/simple-health.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --release --build-number="$BUILD_NUMBER"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"
      - name: Package downloads
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p build/downloads
          if [ "$IS_PULL_REQUEST" = 'true' ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk build/downloads/simple-health-debug.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk build/downloads/simple-health.apk
            cp build/app/outputs/bundle/release/app-release.aab build/downloads/simple-health.aab
          fi
          cd build/downloads
          sha256sum * > SHA256SUMS.txt
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/simple-health.jks"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: simple_health
          script: bash ../scripts/android-smoke-test.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-smoke-${{ github.sha }}
          path: simple_health/build/smoke/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simple-health-android-${{ github.sha }}
          path: simple_health/build/downloads/
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Simple Health Android
          Download the artifact at the bottom of this run and extract the ZIP.
          Install `simple-health.apk` on an Android device. The `.aab` is for store uploads.
          Pull requests provide `simple-health-debug.apk` for development testing.
          Accounts and journals are stored on the device; there is no cloud sign-in.
          SUMMARY

  release:
    name: Publish tagged download
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: simple-health-android-${{ github.sha }}
          path: downloads
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" downloads/* --clobber
          else
            gh release create "$RELEASE_TAG" downloads/* --verify-tag --generate-notes "${args[@]}"
          fi
